services:
  # Render 静态站：托管发布页、version.json 与 APK 安装包
  # 仓库里不放 50MB 的 APK，构建时从 GitHub Release 抓进 dist/releases/，
  # 手机下载走 Render 的 CDN（比直连 GitHub 稳）
  # 后台 → New → Static Site → 选本仓库
  #   Build Command: bash tool/render_build.sh
  #   Publish Directory: dist
  - type: web
    name: plc-monitor-app
    runtime: static
    buildCommand: bash tool/render_build.sh
    staticPublishPath: ./dist
    headers:
      # 版本信息必须实时，否则 App 检查更新会读到缓存里的旧版本
      - path: /version.json
        name: Cache-Control
        value: no-cache, max-age=0
      - path: /releases/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /index.html
        name: Cache-Control
        value: no-cache, max-age=0
